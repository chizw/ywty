name: Rust CI

on:
  push:
    branches: [main, develop, release/**]
    paths:
      - 'server-rust/**'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'server-rust/**'
      - '.github/workflows/rust-ci.yml'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # =========================================
  # 检查：格式、Clippy、编译、测试
  # =========================================
  check:
    name: Rust · check & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-rust

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            server-rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('server-rust/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --verbose
        env:
          YWTY_AUTH_JWT_SECRET: ci-test-secret-key-do-not-use-in-production

      - name: Run tests
        run: cargo test --workspace --verbose
        env:
          YWTY_AUTH_JWT_SECRET: ci-test-secret-key-do-not-use-in-production

  # =========================================
  # Docker 镜像构建测试
  # =========================================
  docker:
    name: Docker · build test
    runs-on: ubuntu-latest
    needs: [check]
    defaults:
      run:
        working-directory: server-rust

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ywty-rust:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
