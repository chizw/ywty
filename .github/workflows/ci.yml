name: CI

on:
  push:
    branches: [main, develop, release/**]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "22"

jobs:
  # =========================================
  # 后端：Go 格式检查、vet、构建、测试
  # =========================================
  backend:
    name: Go · vet & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-go
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 go build -v ./...

      - name: Test
        run: go test -v ./...

  # =========================================
  # 前端：类型检查、主题构建
  # =========================================
  frontend:
    name: Web · type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (type-check + vite + artifact check)
        run: npm run build

      - name: Upload theme artifact
        uses: actions/upload-artifact@v4
        with:
          name: theme-default
          path: themes/default/
          retention-days: 7

  # =========================================
  # Docker · 合并镜像真实构建（node→golang→alpine）
  # =========================================
  docker:
    name: Docker · build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ywty:ci-test

      - name: Smoke test image
        run: |
          docker run -d --rm --name ywty-smoke -p 3000:3000 ywty:ci-test
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/healthz; then ok=1; break; fi
            sleep 1
          done
          docker logs ywty-smoke
          test "${ok:-0}" = "1"
          curl -fsS http://127.0.0.1:3000/api/v2/__nope__ | grep -q '"status":"error"'
          curl -fsS http://127.0.0.1:3000/ | grep -qi '<div id="app">'
          docker stop ywty-smoke
