name: CI

on:
  push:
    branches: [main, develop, release/**]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"
  RUSTFLAGS: "-D warnings"

jobs:
  # =========================================
  # 后端：Rust 编译、Clippy、测试
  # =========================================
  backend:
    name: Rust · check & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-rust
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            server-rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('server-rust/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --verbose
        env:
          JWT_SECRET: ci-test-secret-key-do-not-use-in-production

      - name: Run tests
        run: cargo test --workspace --verbose
        env:
          JWT_SECRET: ci-test-secret-key-do-not-use-in-production

  # =========================================
  # 前端：类型检查、构建
  # =========================================
  frontend:
    name: Astro · check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-astro
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web-astro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx astro check

      - name: Build
        run: npm run build

  # =========================================
  # Docker 镜像构建测试（不推送）
  # =========================================
  docker:
    name: Docker · build test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ywty:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
