name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v 前缀，如 1.0.0）'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: "22"

jobs:
  # =========================================
  # 前端主题 + 管理后台构建
  # =========================================
  build-web:
    name: Web · build theme & admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build user theme (web/)
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build-only

      - name: Build admin SPA (admin/)
        working-directory: admin
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Upload static artifacts
        uses: actions/upload-artifact@v4
        with:
          name: static-dist
          path: |
            web/dist
            admin/dist
          retention-days: 3

  # =========================================
  # Go 后端交叉编译（linux amd64/arm64）
  # =========================================
  build-server:
    name: Go · release build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum

      - name: Build
        working-directory: server-go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w" -o ../ywty-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/ywty

      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ywty-*
          retention-days: 3

  # =========================================
  # 构建合并镜像并推送（web + admin + Go 单二进制）
  # =========================================
  docker-push:
    name: Docker · build & push
    runs-on: ubuntu-latest
    needs: [build-web, build-server]
    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifact

      - name: Assemble build context
        run: |
          mkdir -p ctx/public ctx/admin ctx/bin
          cp -r artifact/static-dist/web/dist/*   ctx/public/
          cp -r artifact/static-dist/admin/dist/* ctx/admin/
          cp artifact/server-linux-amd64/ywty-linux-amd64 ctx/bin/ywty
          chmod +x ctx/bin/ywty
          cp LICENSE.md CHANGELOG.md ctx/

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./ctx
          file: ./Dockerfile.release
          push: true
          tags: |
            ghcr.io/chizw/ywty:latest
            ghcr.io/chizw/ywty:v${{ inputs.version }}
          provenance: false

      - name: Smoke test image
        run: |
          docker run -d --rm --name ywty-release-smoke -p 3000:3000 ghcr.io/chizw/ywty:v${{ inputs.version }}
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/healthz; then ok=1; break; fi
            sleep 1
          done
          test "${ok:-0}" = "1"
          docker stop ywty-release-smoke

  # =========================================
  # 创建 Tag 和 Release
  # =========================================
  release:
    name: Create Tag & Release
    runs-on: ubuntu-latest
    needs: [docker-push]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifact

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | sed -n '1p')
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "## What's Changed" >> $GITHUB_OUTPUT
          git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "**Full Changelog**: https://github.com/chizw/ywty/compare/$PREV_TAG...v${{ inputs.version }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Package offline zip
        run: |
          VERSION="${{ inputs.version }}"
          mkdir -p "ywty-${VERSION}"
          cp artifact/server-linux-amd64/ywty-linux-amd64  "ywty-${VERSION}/ywty-linux-amd64"
          cp artifact/server-linux-arm64/ywty-linux-arm64  "ywty-${VERSION}/ywty-linux-arm64"
          cp -r artifact/static-dist/web/dist/*            "ywty-${VERSION}/public/"
          cp -r artifact/static-dist/admin/dist            "ywty-${VERSION}/admin"
          cp LICENSE.md CHANGELOG.md README.md             "ywty-${VERSION}/"
          zip -qr "ywty-${VERSION}.zip" "ywty-${VERSION}"

      - name: Create and push tag
        run: |
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version }}"
          name: "v${{ inputs.version }}"
          generate_release_notes: true
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: ${{ contains(inputs.version, 'rc') || contains(inputs.version, 'beta') || contains(inputs.version, 'alpha') }}
          files: ywty-*.zip
