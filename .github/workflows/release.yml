name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v 前缀，如 1.0.0）'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"
  RUSTFLAGS: "-D warnings"

jobs:
  # =========================================
  # 后端：Rust 编译、测试
  # =========================================
  backend:
    name: Rust · build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-rust
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            server-rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('server-rust/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev

      - name: Build
        run: cargo build --release --workspace --verbose
        env:
          JWT_SECRET: ci-test-secret-key-do-not-use-in-production

      - name: Run tests
        run: cargo test --release --workspace --verbose
        env:
          JWT_SECRET: ci-test-secret-key-do-not-use-in-production

  # =========================================
  # 前端：构建
  # =========================================
  frontend:
    name: Astro · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-astro
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web-astro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # =========================================
  # Docker 镜像构建并推送
  # =========================================
  docker:
    name: Docker · build & push
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/chizw/ywty:latest
            ghcr.io/chizw/ywty:v${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # =========================================
  # 创建 Tag 和 Release
  # =========================================
  release:
    name: Create Tag & Release
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | sed -n '1p')
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "## What's Changed" >> $GITHUB_OUTPUT
          git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "**Full Changelog**: https://github.com/chizw/ywty/compare/$PREV_TAG...v${{ inputs.version }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version }}"
          name: "v${{ inputs.version }}"
          generate_release_notes: true
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: ${{ contains(inputs.version, 'rc') || contains(inputs.version, 'beta') || contains(inputs.version, 'alpha') }}
