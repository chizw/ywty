name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v 前缀，如 1.0.0）'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"
  RUSTFLAGS: "-D warnings"
  JWT_SECRET: ci-test-secret-key-do-not-use-in-production

jobs:
  # =========================================
  # 质量门：fmt / clippy / test（dev profile，快速反馈）
  # =========================================
  verify-backend:
    name: Rust · check & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-rust
    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rust

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --verbose

  # =========================================
  # 前端：类型检查 + 构建 + 产出 dist
  # =========================================
  build-web:
    name: Astro · check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-astro
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web-astro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx astro check

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-astro/dist

  # =========================================
  # 原生编译后端二进制（x64）
  # =========================================
  build-api:
    name: Rust · release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rust

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev

      - name: Build (release)
        run: cargo build --release --bin api
        working-directory: server-rust

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: api-amd64
          path: server-rust/target/release/api

  # =========================================
  # 组装上下文 → 构建多架构镜像并推送（秒级，无编译）
  # =========================================
  docker-push:
    name: Docker · build & push
    runs-on: ubuntu-latest
    needs: [verify-backend, build-web, build-api]
    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifact

      - name: Assemble build context
        run: |
          mkdir -p ctx/linux-amd64
          cp artifact/api-amd64/api    ctx/linux-amd64/api
          chmod +x ctx/linux-amd64/api
          cp -r artifact/web-dist/dist ctx/dist
          cp Caddyfile                 ctx/Caddyfile
          cp server-rust/config.yaml   ctx/config.yaml

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./ctx
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/chizw/ywty:latest
            ghcr.io/chizw/ywty:v${{ inputs.version }}
          provenance: false

  # =========================================
  # 创建 Tag 和 Release
  # =========================================
  release:
    name: Create Tag & Release
    runs-on: ubuntu-latest
    needs: [docker-push]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | sed -n '1p')
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "## What's Changed" >> $GITHUB_OUTPUT
          git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "**Full Changelog**: https://github.com/chizw/ywty/compare/$PREV_TAG...v${{ inputs.version }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version }}"
          name: "v${{ inputs.version }}"
          generate_release_notes: true
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: ${{ contains(inputs.version, 'rc') || contains(inputs.version, 'beta') || contains(inputs.version, 'alpha') }}
