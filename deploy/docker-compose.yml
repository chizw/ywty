# 一键拉起完整开发环境（源码构建）：
#   - MariaDB 10.11（生产适配目标版本）
#   - Redis 7（缓存）
#   - ywty 应用（Rust API + Astro 前端合并镜像）
#
# 用法：
#   docker compose --profile mysql up -d      # MariaDB
#   docker compose --profile redis up -d      # Redis
#   docker compose --profile app up -d        # 业务应用
#
# 生产部署建议：数据库 / Redis 直接复用宿主机已有实例（监听 127.0.0.1），
# 使用根目录 docker-compose.yml 的 network_mode: host 形态，无需这些容器。

services:
  mariadb:
    image: mariadb:10.11
    container_name: ywty-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpw}
      MARIADB_DATABASE: ywty
      MARIADB_USER: ywty
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-ywty_pw}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: ["mysql"]

  redis:
    image: redis:7-alpine
    container_name: ywty-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["redis"]

  ywty:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ywty
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      # 短变量名直接覆盖 config.yaml（详见 .env.example）
      APP_ENV: dev
      API_PORT: 3001
      API_INTERNAL: http://127.0.0.1:3001
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      DB_PATH: /app/data/ywty.db
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ywty
      DB_PASSWORD: ${MARIADB_PASSWORD:-ywty_pw}
      DB_NAME: ywty
      REDIS_ADDR: redis:6379
      # 留空则由容器入口脚本自动生成并持久化到数据卷；集群部署请在 .env 固定
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "3000:3000"
    volumes:
      - ywty_data:/app/data
      - ywty_uploads:/app/uploads

volumes:
  mariadb_data:
  redis_data:
  ywty_data:
  ywty_uploads:
