# Supervisor 进程管理配置示例
# 安装: apt install supervisor
# 配置: cp deploy/supervisor.conf /etc/supervisor/conf.d/ywty.conf
# 重载: supervisorctl reread && supervisorctl update

[program:ywty]
command=/opt/ywty/api
directory=/opt/ywty
autostart=true
autorestart=true
startretries=5
user=ywty
environment=APP_ENV="prod",YWTY_APP_PORT="3000"
stdout_logfile=/var/log/ywty/api.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
redirect_stderr=true
stopwaitsecs=30
