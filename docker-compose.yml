services:
  ywty:
    build: .
    image: ywty:local
    restart: unless-stopped
    network_mode: host
    environment:
      HOST: 127.0.0.1
      PORT: "3000"
      APP_URL: https://img.example.com
      APP_NAME: ywty

      # 首次启动自动安装（安装完成后可删除这几项）
      #APP_LICENSE_KEY: 替换为授权密钥
      #ADMIN_USERNAME: admin
      #ADMIN_EMAIL: admin@example.com
      #ADMIN_PASSWORD: Your_Password

      # 数据库：默认 SQLite（./data/ywty.db）
      # 使用已有 MySQL / MariaDB(≥10.6) 时取消注释并修改：
      #DB_DRIVER: mysql
      #DB_HOST: 127.0.0.1
      #DB_PORT: 3306
      #DB_USER: ywty
      #DB_PASSWORD: Your_Password
      #DB_NAME: ywty

      #Redis 缓存（可选）
      #REDIS_ADDR: 127.0.0.1:6379
      #REDIS_PASSWORD: Your_Password

    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
