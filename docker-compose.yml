services:
  ywty:
    image: ghcr.io/chizw/ywty:latest
    restart: unless-stopped
    network_mode: host
    environment:
      HOST: 127.0.0.1
      PORT: "3000"
      # JWT 密钥：留空/注释 = 自动生成并持久化到数据卷
      #JWT_SECRET: 替换为强随机密钥
      APP_URL: https://img.example.com

      # 数据库：默认 SQLite（./data/ywty.db）
      # 使用已有 MySQL / MariaDB(≥10.6) 时取消注释并修改：
      #DB_DRIVER: mysql
      #DB_HOST: 127.0.0.1
      #DB_PORT: 3306
      #DB_USER: ywty
      #DB_PASSWORD: Your_Password
      #DB_NAME: ywty

      #Redis 缓存（可选）
      #REDIS_ADDR: 127.0.0.1:6379
      #REDIS_PASSWORD: Your_Password

    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads