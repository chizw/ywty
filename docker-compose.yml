services:
  ywty:
    image: ghcr.io/chizw/ywty:latest
    restart: unless-stopped
    volumes:
      - ./data:/app/data   # 数据库 + 自动生成的 JWT 密钥（/app/data/.jwt_secret）
      - ./uploads:/app/uploads
    ports:
      - "127.0.0.1:3000:3000"
    # 单容器部署无需任何环境变量：JWT 密钥首次启动自动生成并持久化到数据卷。
    # 仅在需要固定密钥（集群多实例）或自定义域名时，取消注释并修改：
    # environment:
    #   JWT_SECRET: 替换为强随机密钥
    #   APP_URL: https://img.example.com

# 站点名称、描述、页脚、注册开关等一律在 /admin/settings 后台修改。
