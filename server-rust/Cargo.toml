[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ywty"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# Web framework
axum = { version = "0.7", features = ["multipart", "macros"] }
axum-extra = { version = "0.9", features = ["cookie", "typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "compression-br"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "mysql", "chrono", "uuid", "migrate", "json"] }

# Redis
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Authentication
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
argon2 = "0.5"
rand = "0.8"

# Validation
validator = { version = "0.18", features = ["derive"] }

# Error handling
thiserror = "1"
anyhow = "1"
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"
mime = "0.3"
reqwest = { version = "0.12", features = ["json", "multipart"] }

# Config
config = "0.14"
dotenvy = "0.15"

# Image processing
image = "0.25"
imageproc = "0.25"
ab_glyph = "0.2"

# AWS S3 SDK
aws-sdk-s3 = "1"
aws-credential-types = "1"

# Email (SMTP)
lettre = { version = "0.11", features = ["tokio1-native-tls"] }

# Base64 encoding
base64 = "0.22"

# URL encoding (OAuth redirect URIs)
urlencoding = "2"

# Cookie handling (OAuth state)
cookie = "0.18"
time = "0.3"

# HMAC / SHA for storage driver signing
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"

# Captcha Generation
captcha = "0.0.9"

# File type detection
infer = "0.16"

# MD5 hashing
md5 = "0.7"

# OpenAPI/Swagger
utoipa = { version = "5", features = ["chrono", "uuid", "preserve_order"] }
# utoipa-swagger-ui 需要从 GitHub 下载资源，暂时注释掉
# utoipa-swagger-ui = { version = "8", features = ["axum"] }

# Integration test utilities
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
# 只保留行号表：回溯仍有 文件:行号，但 Windows 下 PDB 体积可降一个数量级
debug = "line-tables-only"

