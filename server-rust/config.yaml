app:
  name: "云雾图驿"
  env: "dev"
  host: "0.0.0.0"
  port: 3000
  timezone: "Asia/Shanghai"
  base_url: "http://localhost:3000"

database:
  driver: "sqlite"
  path: "./data/ywty.db"
  max_open_conns: 100
  max_idle_conns: 10

redis:
  addr: ""
  password: null
  db: 0

auth:
  jwt:
    secret: "please-change-me-in-production"
    access_expire: 7200
    refresh_expire: 2592000

storage:
  driver: "local"
  root: "./uploads"
  url: "http://localhost:3000/uploads"

queue:
  concurrency: 10
  queues:
    - critical
    - default
    - low

ratelimit:
  enable: true
  upload_per_minute: 60
  api_per_minute: 300

notify:
  mail:
    driver: "smtp"
    host: "smtp.example.com"
    port: 587
    username: "noreply@example.com"
    password: "your-password"
    from: "云雾图驿 <noreply@example.com>"
  sms:
    driver: "aliyun"
    access_key: ""
    secret_key: ""

# OAuth 配置（可选，未配置则 OAuth 登录不可用）
# oauth:
#   github:
#     client_id: "your-github-client-id"
#     client_secret: "your-github-client-secret"
#     redirect_uri: "http://localhost:3000/api/v1/oauth/github/callback"
#   google:
#     client_id: "your-google-client-id"
#     client_secret: "your-google-client-secret"
#     redirect_uri: "http://localhost:3000/api/v1/oauth/google/callback"

# 水印配置
watermark:
  enabled: false
  text: "{site_name}"
  position: "bottom-right"  # top-left | top-right | bottom-left | bottom-right | center
  opacity: 128               # 0-255
  font_size: 24.0
  font_path: null            # null 则使用打包的 CJK 字体
  mode: "site_name"          # site_name | username | both
